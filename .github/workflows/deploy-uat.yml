name: Deploy UAT API

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: uat-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.UAT_SSH_KEY }}" > ~/.ssh/uat_key
          chmod 600 ~/.ssh/uat_key
          ssh-keyscan -p "${{ secrets.UAT_SSH_PORT || 22 }}" -H "${{ secrets.UAT_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy API into Coolify container (nginx proxies :8112)
        env:
          HOST: ${{ secrets.UAT_HOST }}
          USER: ${{ secrets.UAT_USER }}
          PORT: ${{ secrets.UAT_SSH_PORT || 22 }}
        run: |
          ssh -i ~/.ssh/uat_key -p "${PORT}" -o IdentitiesOnly=yes "${USER}@${HOST}" 'mkdir -p /tmp/kincore-api-src'
          rsync -az --delete \
            -e "ssh -i ~/.ssh/uat_key -p ${PORT} -o IdentitiesOnly=yes" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'uploads/' \
            --exclude 'coverage/' \
            ./ "${USER}@${HOST}:/tmp/kincore-api-src/"
          ssh -i ~/.ssh/uat_key -p "${PORT}" -o IdentitiesOnly=yes "${USER}@${HOST}" 'bash -s' << 'EOF'
            set -e
            CONTAINER=$(docker ps --filter publish=8112 --format "{{.Names}}" | head -1)
            if [ -z "$CONTAINER" ]; then
              echo "No container publishing host port 8112 (uat-api proxy target)" >&2
              exit 1
            fi
            docker cp /tmp/kincore-api-src/. "${CONTAINER}:/app/"
            docker exec "$CONTAINER" npm ci --omit=dev
            docker restart "$CONTAINER"
            sleep 4
            curl -fsS http://127.0.0.1:8112/health
            echo
          EOF
